<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-KOPI POS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f3f4f6;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.wrapper {
  width: 100%;
  max-width: 1100px;
  height: 650px;
  background: white;
  border-radius: 30px;
  display: flex;
  overflow: hidden;
  box-shadow: 0 30px 60px rgba(0,0,0,0.1);
}

.left {
  flex: 1;
  padding: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.left h1 {
  font-size: 32px;
  margin-bottom: 5px;
}

.left p {
  color: #666;
  margin-bottom: 40px;
}

.card {
  background: #fff;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

.card h2 {
  margin-bottom: 25px;
}

.input-group {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #4f8cff, #2563eb);
  color: white;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
}

button:hover {
  opacity: 0.9;
}

.right {
  flex: 1;
  background: linear-gradient(135deg, #4f8cff, #2563eb);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  padding: 40px;
  text-align: center;
}

.right h2 {
  font-size: 28px;
}

/* MOBILE */
@media (max-width: 900px) {
  .wrapper {
    flex-direction: column;
    height: auto;
    border-radius: 0;
  }

  .right {
    display: none;
  }

  body {
    height: auto;
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="left">
    <h1>E-Inventory</h1>
    <p>Online inventory management system</p>

    <div class="card">
      <h2>Login</h2>

      <div class="input-group">
        <input type="email" id="email" placeholder="Email Address">
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Password">
      </div>

      <button onclick="login()">Log in</button>

      <div id="message" style="margin-top:15px;color:red;"></div>
    </div>
  </div>

  <div class="right">
    <div>
      <h2>POS Management System</h2>
      <p>Kelola penjualan & inventory dengan mudah.</p>
    </div>
  </div>

</div>

<script>

const client = window.supabase.createClient(
  "https://wlaxqwqvefnwwczbhkjl.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsYXhxd3F2ZWZud3djemJoa2psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODkwMDAsImV4cCI6MjA4Nzc2NTAwMH0.uDC3HPsMhHstIY92sMxlOy-WeBBY6jN5EHyp_Qcbaso"
);

async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    document.getElementById("message").innerText = error.message;
    return;
  }

  window.location.href = "dashboard.html";
}

</script>

</body>
</html>
