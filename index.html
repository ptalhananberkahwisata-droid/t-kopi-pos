<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>T-KOPI POS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body style="font-family:monospace;padding:20px">

<h2>T-KOPI WEB POS</h2>

<input id="shiftId" placeholder="Masukkan Shift ID" style="width:300px"><br><br>
<button onclick="closeShift()">TUTUP SHIFT & PRINT</button>

<div id="receipt"></div>

<script>

const supabase = window.supabase.createClient(
  "https://wlaxqwqvefnwwczbhkjl.supabase.co",
  "ISI_PUBLIC_ANON_KEY_KAMU"
);

async function closeShift() {

  const shiftId = document.getElementById("shiftId").value;

  const { data, error } = await supabase
    .from("shift_close_report_view")
    .select("*")
    .eq("shift_id", shiftId)
    .single();

  if (error) {
    alert(error.message);
    return;
  }

  let html = `
  <h3>T-KOPI COFFEE</h3>
  =====================<br>
  Shift ID: ${data.shift_id}<br>
  Kasir: ${data.cashier_email}<br>
  Open: ${data.open_time}<br>
  Close: ${data.close_time}<br>
  ---------------------<br>
  Total Transaksi: ${data.total_transactions}<br>
  Total Revenue: Rp ${data.total_revenue}<br>
  ---------------------<br>
  <b>PAYMENT SUMMARY</b><br>
  `;

  if (data.payment_summary) {
    data.payment_summary.forEach(p => {
      html += `${p.payment_method} : Rp ${p.total_amount}<br>`;
    });
  }

  html += `<br><b>ITEM TERJUAL</b><br>`;

  if (data.items_summary) {
    data.items_summary.forEach(i => {
      html += `${i.product_name} (${i.total_qty}) : Rp ${i.total_amount}<br>`;
    });
  }

  html += `<br>=====================<br>TERIMA KASIH`;

  document.getElementById("receipt").innerHTML = html;

  window.print();
}

</script>

</body>
</html>
