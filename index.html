<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-KOPI POS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f4f6f9;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  font-size: 20px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid #ddd;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 14px;
  background: #111827;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #000;
}

.receipt {
  margin-top: 20px;
  font-size: 13px;
  line-height: 1.6;
  background: #fafafa;
  padding: 15px;
  border-radius: 10px;
  white-space: pre-line;
}

/* Tablet */
@media (min-width: 768px) {
  .container {
    max-width: 600px;
  }
}

/* Desktop */
@media (min-width: 1024px) {
  .container {
    max-width: 700px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h1>T-KOPI SHIFT REPORT</h1>

    <input id="shiftId" placeholder="Masukkan Shift ID">

    <button onclick="closeShift()">TUTUP SHIFT & PRINT</button>

    <div id="receipt" class="receipt"></div>
  </div>
</div>

<script>

const client = window.supabase.createClient(
  "https://wlaxqwqvefnwwczbhkjl.supabase.co",
  "ISI_PUBLIC_ANON_KEY_KAMU"
);

async function closeShift() {

  const shiftId = document.getElementById("shiftId").value;

  const { data, error } = await client
    .from("shift_close_report_view")
    .select("*")
    .eq("shift_id", shiftId)
    .single();

  if (error) {
    alert(error.message);
    return;
  }

  let receiptText = `
T-KOPI COFFEE
========================
Shift ID : ${data.shift_id}
Kasir    : ${data.cashier_email}
Open     : ${data.open_time}
Close    : ${data.close_time}
------------------------
Total Transaksi : ${data.total_transactions}
Total Revenue   : Rp ${data.total_revenue}
------------------------
PAYMENT SUMMARY
`;

  if (data.payment_summary) {
    data.payment_summary.forEach(p => {
      receiptText += `${p.payment_method} : Rp ${p.total_amount}\n`;
    });
  }

  receiptText += `\nITEM TERJUAL\n`;

  if (data.items_summary) {
    data.items_summary.forEach(i => {
      receiptText += `${i.product_name} (${i.total_qty}) : Rp ${i.total_amount}\n`;
    });
  }

  receiptText += `
========================
TERIMA KASIH
`;

  document.getElementById("receipt").textContent = receiptText;

  window.print();
}

</script>

</body>
</html>
